[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-player-image-tool"
version = "1.0.0"
description = "Generate Spotify player card images with album art and track info"
authors = [
    {name = "Ou7line", email = "dev@ou7line.com"},
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "Pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
