version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./output:/app/output
      - ./static:/app/static
      - ./main.py:/app/main.py
      - ./renderer.py:/app/renderer.py
      - ./spotify_client.py:/app/spotify_client.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
